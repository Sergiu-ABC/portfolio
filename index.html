    <!-- Set the theme before the first paint: dark unless the visitor chose light. -->
    <script>
      (function () {
        var theme = 'dark';
        try {
          if (localStorage.getItem('theme') === 'light') theme = 'light';
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', theme);
        if (theme === 'light') {
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', '#fbfcfb');
        }
      })();
    </script>
